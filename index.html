<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: hsl(38, 33%, 96%);
      color: hsl(24, 18%, 13%);
      font-family: Georgia, "Times New Roman", serif;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <h1>Hello World</h1>
</body>
</html>
