<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reindirizzamento a Hello, World — gianmaria-m</title>
  <meta name="description" content="Reindirizzamento automatico verso la pagina Hello, World di gianmaria-m.">
  <meta http-equiv="refresh" content="0; url=https://gianmaria-m.github.io/hello-world/">
  <link rel="canonical" href="https://gianmaria-m.github.io/hello-world/">
  <script>
    window.location.replace("https://gianmaria-m.github.io/hello-world/");
  </script>
  <style>
    :root {
      --bg-canvas: hsl(38, 33%, 96%);
      --bg-surface: hsl(40, 45%, 99%);
      --ink-primary: hsl(24, 18%, 13%);
      --ink-secondary: hsl(24, 9%, 42%);
      --accent: hsl(14, 62%, 47%);
      --hairline: hsla(24, 18%, 13%, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
    }

    main {
      width: 100%;
      max-width: 460px;
      background: var(--bg-surface);
      border: 1px solid var(--hairline);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--ink-secondary);
    }

    a {
      color: var(--accent);
      font-weight: 500;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World.</h1>
    <p>
      Reindirizzamento in corso… Se non vieni reindirizzato automaticamente,
      <a id="redirect-link" href="https://gianmaria-m.github.io/hello-world/">apri Hello, World qui</a>.
    </p>
  </main>
</body>
</html>
